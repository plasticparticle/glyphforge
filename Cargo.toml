[workspace]
resolver = "3"
members = ["crates/tuiforge-core", "crates/tuiforge"]
default-members = ["crates/tuiforge"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/plasticparticle/glyphforge"
authors = ["TUIForge contributors"]

[workspace.dependencies]
tuiforge-core = { path = "crates/tuiforge-core", version = "0.1.0" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
thiserror = "2.0"
anyhow = "1.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"

ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "underline-color", "macros"] }
crossterm = { version = "0.29" }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
